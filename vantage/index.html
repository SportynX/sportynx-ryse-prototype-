.pchart .vl{font:600 10.5px var(--font-body);fill:var(--text);text-anchor:middle}
.pchart .lb{font:500 10.5px var(--font-body);fill:var(--faint);text-anchor:middle}
.pchart .lb.on{fill:var(--blue-2);font-weight:700}
.pchart .avgl{stroke:var(--blue-3);stroke-width:1.2;stroke-dasharray:4 4;opacity:.8}
.plg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 4px 2px;font:500 12px/1 var(--font-body);color:var(--mut)}
.plg span{display:flex;align-items:center;gap:6px}
.plg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.plg i.s0{background:var(--blue)}.plg i.s1{background:#8FB0FF}.plg i.sx{background:rgba(255,255,255,.22)}.plg i.s2{border:1px dashed rgba(111,152,255,.7);background:rgba(111,152,255,.12)}
.plg i.avg{height:0;width:14px;border-top:1.5px dashed var(--blue-3);border-radius:0}
.plg i.rc{border-radius:50%}
.rpe-row{display:grid;grid-template-columns:auto repeat(7,1fr);align-items:center;gap:4px;margin-top:10px;padding:0 6px 0 2px;font:600 13px/1 var(--font-body);text-align:center;font-variant-numeric:tabular-nums}
.rpe-row .mlabel{font-size:9.5px;margin-right:6px}
.rpe-row span.hi{color:var(--blue-3)}
.nights{display:flex;flex-direction:column;margin-top:10px;border-top:1px solid var(--line)}
.nights>div{display:grid;grid-template-columns:34px 92px 1fr 62px;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font:500 13px/1 var(--font-body);font-variant-numeric:tabular-nums}
.nights .d{color:var(--mut);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.nights .bw{color:var(--mut);font-size:12px}
.nights .bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.06)}
.nights .bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#3E74F5,#8FB0FF)}
.nights b{text-align:right;font-weight:600}
.recrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.recrow.m{grid-template-columns:repeat(30,1fr);gap:2px}
.recrow span{display:flex;flex-direction:column;align-items:center;gap:6px}
.recrow i{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);box-sizing:border-box}
.recrow.m i{width:100%;height:auto;aspect-ratio:1;max-width:12px;border-width:1.5px}
.recrow small{font:500 10.5px/1 var(--font-body);color:var(--faint)}
.recrow .good i,.plg i.rc.good{background:rgba(31,107,255,.35);border-color:var(--blue-2)}
.recrow .normal i,.plg i.rc.normal{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.12)}
.recrow .low i,.plg i.rc.low{border-color:#F0A050;background:rgba(240,160,80,.16)}
.recrow .fut i{border-style:dashed;border-color:rgba(255,255,255,.12)}

/* ================= HEALTH ================= */
.pill.warn{border-color:rgba(229,72,77,.5);color:#FF9C9F;background:var(--inj-soft)}
.live{display:inline-flex;align-items:center;gap:7px;font:600 10.5px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:#FF9C9F}
.live i{width:7px;height:7px;border-radius:50%;background:var(--inj);box-shadow:0 0 0 0 rgba(229,72,77,.6);animation:livep 1.8s ease-out infinite}
@keyframes livep{0%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}100%{box-shadow:0 0 0 9px rgba(229,72,77,0)}}
.live.sm{font-size:9.5px;letter-spacing:.12em;flex:none}
.inj-hero{padding:18px;border-radius:22px;border:1px solid rgba(229,72,77,.35);background:radial-gradient(90% 120% at 100% 0%,rgba(229,72,77,.14),transparent 60%),linear-gradient(170deg,rgba(255,255,255,.05),rgba(255,255,255,.012) 70%)}
.inj-hero.ok{border-color:var(--line);background:var(--card)}
.inj-hero.ok .live{color:var(--blue-3)}.inj-hero.ok .live i{background:var(--blue);animation:none}
.inj-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.inj-hero h3{margin:14px 0 0;font:700 28px/1.02 var(--font-display);text-transform:uppercase;letter-spacing:-.015em}
.inj-ty{margin-top:8px;font:500 14px/1.4 var(--font-body);color:var(--mut)}
.inj-st{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.inj-prog{margin-top:16px}
.inj-prog .lbl{display:flex;justify-content:space-between;gap:10px;font:500 12px/1.2 var(--font-body);color:var(--mut);margin-bottom:8px}
.inj-prog .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.inj-prog .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--inj),#FF9C9F);animation:grow 1.1s var(--ease) both;transform-origin:left}
.b7{position:relative;margin-top:12px;height:400px;border-radius:22px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(70% 55% at 50% 45%,rgba(31,107,255,.14),transparent 70%),#05080F}
.b7-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.b7-msg{position:absolute;inset:0;display:grid;place-items:center;font:500 13px/1.4 var(--font-body);color:var(--faint);pointer-events:none}
.b7-tag{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:14px;background:rgba(10,12,18,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:600 12px/1 var(--font-body);color:#fff}
.b7-tag i{width:8px;height:8px;border-radius:50%;background:var(--inj)}
.b7-v{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(10,12,18,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.b7-v button{height:32px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--mut);font:600 12.5px/1 var(--font-body);cursor:pointer}
.b7-v button:hover,.b7-v button:active{background:rgba(255,255,255,.1);color:#fff}
.ph7-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ph7{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);padding:0;cursor:pointer;background:radial-gradient(80% 70% at 40% 35%,hsl(var(--h1,20) 30% 42%),hsl(var(--h1,20) 25% 16%) 70%,#0A0C12);color:#fff;text-align:left}
.ph7 .ph7-i{position:absolute;inset:0;background:radial-gradient(40% 30% at 55% 45%,rgba(255,180,170,.28),transparent 70%);filter:blur(6px)}
.ph7 .ph7-t{position:absolute;left:12px;right:12px;bottom:10px;display:flex;flex-direction:column;gap:3px}
.ph7 .ph7-t b{font:600 13px/1.2 var(--font-body)}.ph7 .ph7-t small{font:500 11.5px/1 var(--font-body);color:rgba(232,236,244,.75)}
.ph7.big{cursor:default;width:100%}
.hnote{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:18px;border:1px solid rgba(229,72,77,.35);background:linear-gradient(155deg,rgba(229,72,77,.12),rgba(255,255,255,.02) 62%);color:var(--text);text-align:left;cursor:pointer}
.hnote .t{flex:1;min-width:0}
.hnote b{display:block;font:600 15px/1.2 var(--font-body)}
.hnote small{display:block;margin-top:4px;font:500 12.5px/1.3 var(--font-body);color:var(--mut)}
.hnote .hn-i{display:none}
.hnote svg.chev{width:16px;height:16px;color:var(--faint);flex:none}
.rows.ther .r.mine{background:rgba(31,107,255,.06)}
.rows .r small.by{color:var(--blue-3);font-weight:600;margin-top:3px}
.pastT{margin-top:12px}
.pastT summary{cursor:pointer;font:600 13px/1 var(--font-body);color:var(--mut);padding:8px 2px;list-style:none}
.pastT summary::-webkit-details-marker{display:none}
.pastT summary::before{content:"› ";color:var(--faint)}
.pastT[open] summary::before{content:"⌄ "}
.pchart .sb.sm{fill:#F5F7FB}
.plg i.sm{background:#F5F7FB}
/* photo avatars */
.ava.ph{padding:0;background:#0E1016}
.ava.ph img{width:100%;height:100%;object-fit:cover;display:block}
.me-ph{position:relative;cursor:pointer;flex:none;border-radius:50%}
.me-cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:#F5F7FB;color:#0A1430;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.me-cam svg{width:15px;height:15px}
.me-ph:focus-within{outline:1.5px solid var(--blue-3);outline-offset:3px}
@container (max-width:760px){.ahead .lv{flex-wrap:wrap;row-gap:10px}.ahead .lv .lvl{font-size:20px}}

/* ===== RYSEON Progress + score rings: copied from the RYSEON app so both render identically ===== */
.h-idx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.h-ix{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 11px;border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:var(--ryse-white);cursor:pointer;min-width:0}
.h-ix .r{position:relative;width:58px;height:58px}
.h-ix .r svg{width:100%;height:100%;transform:rotate(-90deg)}
.h-ix .r circle{fill:none;stroke-width:5}
.h-ix .r .trk{stroke:rgba(255,255,255,.08)}
.h-ix .r .val{stroke:var(--rb);stroke-linecap:round}
.h-ix .r span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.h-ix .r b{font:700 18px/1 var(--font-display);font-variant-numeric:tabular-nums}
.h-ix .r em{font:500 9px/1 var(--font-body);font-style:normal;color:rgba(200,207,221,.6)}
.h-ix .ic{width:18px;height:18px;color:rgba(245,247,251,.92);margin-top:2px}
.h-ix small{font:600 12px/1.1 var(--font-body);color:var(--ryse-white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.h-ix i{font:500 11px/1 var(--font-body);font-style:normal;color:rgba(200,207,221,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
:root{--s-text:#F5F7FB;--s-mut:rgba(200,207,221,.82);--s-faint:rgba(200,207,221,.55);--s-card:rgba(255,255,255,.04);--s-line:rgba(255,255,255,.08);--s-input:rgba(255,255,255,.05);--s-acc:#6F98FF;--s-sw:rgba(255,255,255,.16);--s-shadow:none}
:root{--c1:#4C7DFF;--c2:rgba(160,184,240,.42);--c3:#E0A54A;--c4:#E25A5A}
.pg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:4px}
.pg-title{margin:0;font:700 34px/1 var(--font-display);letter-spacing:-.02em;text-transform:uppercase;color:var(--s-text)}
.pg-sub{margin:7px 0 0;font:500 14.5px/1.35 var(--font-body);color:var(--s-mut)}
.pg-rep{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--s-line);background:var(--s-card);color:var(--s-text);font:600 14px/1 var(--font-body);cursor:pointer;flex:none;box-shadow:var(--s-shadow)}
.pg-rep svg{width:18px;height:18px}
.pg-sticky{position:sticky;top:-4px;z-index:3;margin:16px -20px 0;padding:8px 20px 10px;background:linear-gradient(180deg,var(--pg-bg,#0C0D10) 75%,transparent)}
.pg-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;border:1px solid var(--s-line);background:var(--s-card)}
.pg-seg button{height:38px;border:0;border-radius:10px;background:transparent;color:var(--s-mut);font:600 14px/1 var(--font-body);cursor:pointer}
.pg-seg button[aria-selected=true]{background:#F5F7FB;color:#0A0B0D}
.pg-q{margin:14px 2px 0;font:500 13.5px/1.4 var(--font-body);color:var(--s-mut);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pg-ex{font:600 10px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--s-faint);border:1px solid var(--s-line);border-radius:6px;padding:4px 6px}
.pg-sum,.pg-next{margin-top:14px;padding:18px 18px 16px;border-radius:20px;border:1px solid rgba(111,152,255,.28);background:linear-gradient(155deg,rgba(31,107,255,.16),var(--s-card) 62%)}
.pg-sum .k,.pg-next .k,.pg-ai .k{display:flex;align-items:center;gap:6px;font:600 10.5px/1 var(--font-body);letter-spacing:.18em;text-transform:uppercase;color:var(--s-acc)}
.pg-sum .k svg,.pg-next .k svg,.pg-ai .k svg{width:12px;height:12px}
.pg-sum p{margin:10px 0 0;font:500 16px/1.45 var(--font-body);color:var(--s-text)}
.pg-next p{margin:10px 0 0;font:600 16.5px/1.45 var(--font-body);color:var(--s-text)}
.pg-h{margin:34px 2px 0;font:700 19px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:-.005em;color:var(--s-text)}
.pg-hs{margin:6px 2px 0;font:500 12.5px/1.3 var(--font-body);color:var(--s-faint)}
.pg-note{margin:10px 2px 0;font:500 12px/1.45 var(--font-body);color:var(--s-faint)}
.pg-chg{margin-top:12px;border-top:1px solid var(--s-line)}
.pg-chg div{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--s-line)}
.pg-chg i{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--font-body);font-style:normal;background:var(--s-card);border:1px solid var(--s-line);color:var(--s-text)}
.pg-chg span{flex:1;font:500 15px/1.25 var(--font-body);color:var(--s-text)}
.pg-chg b{font:600 14px/1.2 var(--font-body);color:var(--s-mut);text-align:right}
.pg-idx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pg-idx>div,.pg-idx>button{width:100%;box-sizing:border-box;text-align:left;align-items:flex-start;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:5px;padding:14px 14px 15px;border-radius:16px;border:1px solid var(--s-line);background:var(--s-card);box-shadow:var(--s-shadow)}
.pg-idx .n{font:600 10.5px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--s-mut)}
.pg-idx b{font:700 30px/1 var(--font-display);color:var(--s-text);font-variant-numeric:tabular-nums;margin-top:3px}
.pg-idx .tr{font:600 12.5px/1 var(--font-body);color:var(--s-acc)}
html:not([data-view]) .pg-idx .tr{color:#8FB0FF}
.pg-idx .tr.stable{color:var(--s-mut)}
.pg-idx .tr.monitor{color:var(--c3)}
.pg-idx p{margin:4px 0 0;font:500 12.5px/1.4 var(--font-body);color:var(--s-mut)}
.pg-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;margin-top:14px}
.pg-stats div{display:flex;flex-direction:column;gap:5px;min-width:0}
.pg-stats b{font:700 22px/1 var(--font-body);color:var(--s-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.pg-stats small{font:500 12px/1.25 var(--font-body);color:var(--s-mut)}
.pg-chart{margin-top:18px;padding:14px 14px 10px;border-radius:16px;border:1px solid var(--s-line);background:var(--s-card);box-shadow:var(--s-shadow)}
.pg-chart svg{display:block;width:100%;height:auto}
.pg-chart.line svg{height:110px}
.pg-chart .gl{stroke:var(--s-line);stroke-width:1;stroke-dasharray:2 4}
.pg-chart .gl.base{stroke-dasharray:none}
.pg-chart .gt{font:500 10px var(--font-body);fill:var(--s-faint);text-anchor:end}
.pg-chart .b1{fill:var(--c2)}
.pg-chart .hit.on{fill:rgba(128,128,128,.08)}
.pg-chart.line svg{height:110px}
.pg-chart .b0{fill:var(--c1)}.pg-chart .b1{fill:var(--c2)}.pg-chart .bz{fill:var(--s-line)}
.pg-chart .hit{fill:transparent;cursor:pointer}
.pg-chart .hit.on{fill:rgba(128,128,128,.12)}
.pg-chart .ln{fill:none;stroke:var(--c1);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pg-chart .ar{fill:var(--c1);opacity:.12}
.pg-chart .lb{display:grid;margin-top:8px;font:500 11px/1 var(--font-body);color:var(--s-faint);text-align:center}
.pg-chart .lg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:10px;font:500 12px/1 var(--font-body);color:var(--s-mut)}
.pg-chart .lg span{display:flex;align-items:center;gap:6px}
.pg-chart .lg i{width:10px;height:10px;border-radius:3px}
.pg-chart .lg i.b0{background:var(--c1)}.pg-chart .lg i.b1{background:var(--c2)}
.pg-chart .cap{margin-left:auto;font:600 12.5px/1 var(--font-body);font-style:normal;color:var(--s-text)}
.pg-ai{margin-top:16px;padding:2px 0 2px 14px;box-shadow:inset 2px 0 0 var(--c1)}
.pg-ai p{margin:8px 0 0;font:500 14.5px/1.45 var(--font-body);color:var(--s-text)}
.pg-sub2{margin-top:20px}
.pg-subh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pg-subh b{font:600 15.5px/1.2 var(--font-body);color:var(--s-text)}
.pg-subh span{font:500 13px/1.2 var(--font-body);color:var(--s-mut);text-align:right}
.pg-hbars{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pg-hbars div{display:grid;grid-template-columns:88px 1fr 56px;align-items:center;gap:10px;font:500 13.5px/1 var(--font-body);color:var(--s-text)}
.pg-hbars i{height:8px;border-radius:4px;background:var(--s-line);overflow:hidden}
.pg-hbars em{display:block;height:100%;border-radius:4px;background:var(--c1)}
.pg-hbars b{font-weight:600;text-align:right;color:var(--s-mut)}
.pg-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pg-split>div{display:flex;flex-direction:column;gap:5px;padding:14px;border-radius:16px;border:1px solid var(--s-line);background:var(--s-card);box-shadow:var(--s-shadow)}
.pg-split small{font:600 10.5px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--s-mut)}
.pg-split b{font:700 20px/1.1 var(--font-body);color:var(--s-text);margin-top:3px}
.pg-split span{font:500 13px/1.3 var(--font-body);color:var(--s-mut)}
.pg-split .na b{color:var(--s-faint)}
.pg-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pg-tags span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--s-line);background:var(--s-card);font:500 13px/1 var(--font-body);color:var(--s-text)}
.pg-tags span b{color:var(--s-mut);font-weight:600}
.pg-tags.big span{height:38px;font-size:14.5px;font-weight:600}
.pg-dist{display:flex;gap:3px;height:12px;margin-top:12px;border-radius:6px;overflow:hidden}
.pg-dist i,.pg-distl i{display:block}
.pg-dist .d0,.pg-distl .d0{background:var(--c1)}.pg-dist .d1,.pg-distl .d1{background:var(--c1);opacity:.5}.pg-dist .d2,.pg-distl .d2{background:var(--c3)}.pg-dist .d3,.pg-distl .d3{background:var(--c4)}
.pg-distl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px;font:500 12.5px/1.2 var(--font-body);color:var(--s-mut)}
.pg-distl span{display:flex;align-items:center;gap:7px}
.pg-distl i{width:9px;height:9px;border-radius:3px;flex:none}
.pg-distl b{color:var(--s-text);font-weight:600;margin-left:auto}

/* ---------- Formatting ---------- */
var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(d,f){
  if(!(d instanceof Date)) d=new Date(d);
  if(f==='dow') return DOW[d.getDay()];
  if(f==='dow3') return DOW[d.getDay()].slice(0,3);
  if(f==='dow1') return DOW[d.getDay()].slice(0,3);
  if(f==='d mon') return d.getDate()+' '+MON[d.getMonth()];
  if(f==='d mon y') return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();
  if(f==='rel'){var o=Math.round((d-TODAY)/864e5);if(o===0)return 'Today';if(o===1)return 'Tomorrow';if(o===-1)return 'Yesterday';if(o>1&&o<7)return DOW[d.getDay()];return DOW[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MON[d.getMonth()]}
  return d.toDateString();
}

function searchDir(q){
  q=norm(q.trim()); if(q.length<2) return [];
  var qid=q.replace(/[^a-z0-9]/g,'');
  return Object.keys(DIRECTORY).map(function(k){return DIRECTORY[k]}).filter(function(a){
    return norm(nm(a)).indexOf(q)>=0||norm(a.last+' '+a.first).indexOf(q)>=0||(qid.length>=3&&a.ryid.toLowerCase().replace(/[^a-z0-9]/g,'').indexOf(qid)>=0);
  }).sort(function(x,y){return nm(x)<nm(y)?-1:1});
}

/* ---------- Globe for the language screen (canvas; quiet rotating dot sphere) ---------- */
var globeRAF=null,globeRot={lon:-30,lat:30,tl:-30,tt:30};
function startGlobe(){
  var cv=document.getElementById('globe'); if(!cv) return; var ctx=cv.getContext('2d'); var N=900,pts=[];
  for(var i=0;i<N;i++){var y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),t=i*2.399963;pts.push([Math.cos(t)*r,y,Math.sin(t)*r])}
  cancelAnimationFrame(globeRAF);
  var L=LANGS[S.lang];globeRot.tl=L[6];globeRot.tt=L[7]*.6;
  function frame(){
    if(!document.getElementById('globe')) return;
    globeRot.lon+=(globeRot.tl-globeRot.lon)*.06; globeRot.lat+=(globeRot.tt-globeRot.lat)*.06;
    var W=600,R=250,cx=300,cy=300;ctx.clearRect(0,0,W,W);
    var lo=globeRot.lon*Math.PI/180,la=globeRot.lat*Math.PI/180,cl=Math.cos(lo),sl=Math.sin(lo),ca=Math.cos(la),sa=Math.sin(la);
    var g=ctx.createRadialGradient(cx-60,cy-80,20,cx,cy,R);g.addColorStop(0,'rgba(47,107,255,.16)');g.addColorStop(1,'rgba(47,107,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
    for(var i=0;i<N;i++){var p=pts[i];var x=p[0]*cl-p[2]*sl,z=p[0]*sl+p[2]*cl,y=p[1];var y2=y*ca-z*sa,z2=y*sa+z*ca;
      if(z2<0) continue; ctx.fillStyle='rgba(214,224,245,'+(0.08+z2*.42)+')';ctx.beginPath();ctx.arc(cx+x*R,cy-y2*R,1.5+z2*.9,0,7);ctx.fill()}
    // marker at language centre (front-facing after rotation)
    var Lc=LANGS[S.lang],mlon=Lc[6]*Math.PI/180,mlat=Lc[7]*Math.PI/180;
    var mx=Math.cos(mlat)*Math.sin(mlon),my=Math.sin(mlat),mz=Math.cos(mlat)*Math.cos(mlon);
    var qx=mx*cl-mz*sl,qz=mx*sl+mz*cl,qy=my*ca-qz*sa;
    var t=Date.now()/1000, rr=8+((t%2.4)/2.4)*26;
    var px=cx+qx*R,py=cy-qy*R;
    ctx.fillStyle='#9DB8FF';ctx.beginPath();ctx.arc(px,py,6,0,7);ctx.fill();
    ctx.strokeStyle='rgba(157,184,255,'+(1-(rr-8)/26)*.7+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py,rr,0,7);ctx.stroke();
    globeRAF=requestAnimationFrame(frame);
  }
  frame();
}
function bindLangRail(){
  var tr=document.getElementById('lang-track'); if(!tr||tr._b) return; tr._b=1;
  var it=tr.querySelectorAll('.lang-item');
  // centre the selected language without animation
  var el=it[S.lang]; tr.scrollLeft=el.offsetLeft-(tr.clientWidth-el.clientWidth)/2;
  var to=null;
  tr.addEventListener('scroll',function(){clearTimeout(to);to=setTimeout(function(){
    var mid=tr.scrollLeft+tr.clientWidth/2,best=0,bd=1e9;
    it.forEach(function(b,i){var c=b.offsetLeft+b.clientWidth/2,d=Math.abs(c-mid);if(d<bd){bd=d;best=i}});
    if(best!==S.lang) setLang(best,false);
  },70)},{passive:true});
}
function setLang(i,scroll){
  S.lang=i; var L=LANGS[i];
  var t=document.getElementById('lang-title'),r=document.getElementById('lang-region'),g=document.getElementById('lang-go');
  if(t){t.textContent=L[4];t.dir=L[0]==='ar'?'rtl':'ltr'} if(r) r.textContent=L[3]; if(g) g.textContent=L[5];
  document.querySelectorAll('.lang-item').forEach(function(b,j){b.classList.toggle('on',j===i);b.setAttribute('aria-selected',j===i)});
  document.querySelectorAll('#lang-dial i').forEach(function(b,j){b.classList.toggle('on',j===i)});
  globeRot.tl=L[6];globeRot.tt=L[7]*.6;
  if(scroll){var tr=document.getElementById('lang-track'),el=tr.querySelectorAll('.lang-item')[i];tr.scrollTo({left:el.offsetLeft-(tr.clientWidth-el.clientWidth)/2,behavior:'smooth'})}
}

function barChart(vals,labels,o){
  o=o||{};var W=600,H=o.h||160,pl=34,pr=8,pt=18,pb=26,mx=o.max||Math.max.apply(null,vals)*1.15,n=vals.length,bw=(W-pl-pr)/n;
  var tick=o.tick||niceTick(mx),top=Math.ceil(mx/tick)*tick;var y=function(v){return pt+(H-pt-pb)*(1-v/top)};
  var g='';for(var v=0;v<=top+1e-9;v+=tick){g+='<line class="gl'+(v===0?' base':'')+'" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="gt" x="'+(pl-8)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+(o.fmt?o.fmt(v):v)+'</text>'}
  var b=vals.map(function(v,i){var w=Math.min(46,bw*.56),xx=pl+bw*i+(bw-w)/2;return '<rect class="bar'+(i===n-1?' on':'')+'" x="'+xx+'" y="'+y(v)+'" width="'+w+'" height="'+Math.max(0,y(0)-y(v))+'" rx="5"/>'+(i===n-1?'<text class="vl" x="'+(xx+w/2)+'" y="'+(y(v)-7)+'">'+(o.vfmt?o.vfmt(v):v)+'</text>':'')+'<text class="lb" x="'+(xx+w/2)+'" y="'+(H-6)+'">'+esc(labels[i])+'</text>'}).join('');

function daySheet(o){
  var d=parseK(o.k),off=Math.round((d-TODAY)/864e5),ids=calIds();
  var ey=off===0?'Today':(off===-1?'Yesterday':(off===1?'Tomorrow':(off>0?'Upcoming':'Day report')));

  ids.forEach(function(id){
    var a=A(id),ev=eventsFor(id,d);
    var rows=ev.length?ev.map(function(e){
      var title=e.k==='m'?(e.ha==='Away'?'@ ':'vs ')+esc(e.opp):esc(e.type);
      var sub=e.time+' · '+e.dur+' min'+(e.k==='m'?' · '+esc(e.note)+' · '+e.ha:(e.note?' · '+esc(e.note):''));
      if(e.by){var x=ADDED.filter(function(z){return z.id===e.xid})[0],others=x.ath.filter(function(z){return z!==id}).map(function(z){return A(z).first});
        sub+='<span class="by">Added by you'+(others.length?' · with '+esc(others.join(', ')):'')+'</span>'}

  else if(!canAdd()) h+='<p class="note" style="margin-top:18px">View only. Each athlete shares this schedule from RYSEON.</p>';

      out.push({k:'log',id:who,at:hhmm(e.time,e.dur+15),ic:CI.up,lbl:'Training logged',title:a.first+' logged today’s '+e.type.toLowerCase(),sub:(r>7.5?'Heavy':'Moderate')+' · RPE '+r+'/10',t:'progress'})}}
  out.sort(function(x,y){return x.at<y.at?-1:1});
  return out.slice(0,2);
}
var IDX=0,N=1,RAF=0,T0=0,DIR=1,HOLD=2600,CPS=30,DRAG=null,SWIPED=0;
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function tw(txt){return '<span class="tw" data-full="'+esc(txt)+'"><span class="tw-on"></span><span class="tw-off">'+esc(txt)+'</span></span>'}
function pl(n,w){return n+' '+w+(n===1?'':'s')}
/* slide 1/N — the day across the team: counts, then the agenda */
function summary(){
  var ids=liveIds(),sch=ids.filter(function(id){return P(id).schedule}),ag=[],c={t:0,r:0,m:0,l:0};
  sch.forEach(function(id){var a=A(id);eventsFor(id,TODAY).forEach(function(e){if(c[e.k]!=null) c[e.k]++;ag.push({at:e.time,end:hhmm(e.time,e.dur||0),who:a.first,what:e.type,id:id,k:e.k})})});
  ag.sort(function(x,y){return x.at<y.at?-1:1});
  var parts=[];if(c.m) parts.push(pl(c.m,'match'));if(c.t) parts.push(pl(c.t,'training session'));if(c.r) parts.push(pl(c.r,'recovery session'));if(c.l) parts.push(pl(c.l,'learning session'));
  var title=parts.length?parts.slice(0,3).join(', ').replace(/, ([^,]*)$/,' and $1')+' today':'A rest day for your team';
  var now=pad(new Date().getHours())+':'+pad(new Date().getMinutes()),nx=ag.filter(function(x){return x.at>=now})[0]||ag[0];
  var inj=ids.filter(function(id){return P(id).health&&typeof INJ!=='undefined'&&INJ[id]}).map(function(id){return A(id).first});
  var sub=(nx?'Next up: '+nx.who+' · '+nx.what+' at '+nx.at+'.':'Nothing scheduled.')+(inj.length?' '+inj.join(' and ')+(inj.length===1?' is':' are')+' managing an injury.':'');
  var list=ag.slice(0,3).map(function(x,i){return '<span class="lv-ag" style="--d:'+i+'"><b>'+x.at+'</b><span>'+esc(x.who)+'</span><em>'+esc(x.what)+'</em></span>'}).join('')+
    (ag.length>3?'<span class="lv-ag more" style="--d:3"><b></b><span>+'+(ag.length-3)+' more in Schedule</span></span>':'')+
    (sch.length<ids.length?'<span class="lv-ag more" style="--d:4"><b></b><span>'+(ids.length-sch.length)+' not sharing schedule</span></span>':'');
  return '<div class="lv-s" data-i="0"><span class="mlabel acc">Today · '+fmt(TODAY,'dow')+'</span>'+
    '<span class="lv-t"><b>'+tw(title)+'</b><small>'+tw(sub)+'</small></span>'+(list?'<span class="lv-list">'+list+'</span>':'')+'</div>'}
function feedHTML(){
  var it=items();N=it.length+1;if(IDX>=N) IDX=0;
  var slides=summary()+it.map(function(x,i){var a=A(x.id);
    return '<div class="lv-s lvev'+(x.warn?' warn':'')+'" data-i="'+(i+1)+'" data-id="'+x.id+'" data-t="'+x.t+'"><span class="mlabel acc"><span class="live sm"><i></i>Live</span>'+x.lbl+' · '+x.at+'</span>'+
      '<span class="lv-row">'+ava(a)+'<span class="lv-t"><b>'+tw(x.title)+'</b><small>'+tw(x.sub)+'</small></span></span></div>'}).join('');
  return '<div class="gl focus lv" data-keep="'+esc(it.map(function(x){return x.title+x.sub}).join('|')+summary().length)+'" role="region" aria-label="Today, live" aria-roledescription="carousel"><div class="lv-top"><span class="lv-bars">'+Array.apply(null,Array(N)).map(function(_,i){return '<i class="'+(i<IDX?'done':'')+'"><b></b></i>'}).join('')+'</span><span class="lv-n">'+(IDX+1)+'/'+N+'</span></div><div class="lv-stage">'+slides+'</div></div>';
}
function root(){return document.querySelector('.gl.lv')}
/* lock the stage to the tallest slide so nothing below ever moves */
function fit(r){var st=r.querySelector('.lv-stage'),h=0;r.querySelectorAll('.lv-s').forEach(function(s){h=Math.max(h,s.scrollHeight)});st.style.height=h+'px'}
function typeSet(s,n){var tws=s.querySelectorAll('.tw'),left=n,done=true;
  tws.forEach(function(t){var f=t.dataset.full,k=Math.max(0,Math.min(f.length,left));left-=f.length;
    if(t._k!==k){t._k=k;t.firstChild.textContent=f.slice(0,k);t.lastChild.textContent=f.slice(k)}
    t.classList.toggle('typing',k>0&&k<f.length);if(k<f.length) done=false});
  return done}
function total(s){var n=0;s.querySelectorAll('.tw').forEach(function(t){n+=t.dataset.full.length});return n}
function show(i,dir){var r=root();if(!r) return;var prev=IDX;IDX=(i+N)%N;DIR=dir||(IDX>=prev?1:-1);
  r.querySelectorAll('.lv-s').forEach(function(s){var k=+s.dataset.i;s.style.transform='';s.style.transition='';
    s.classList.remove('in','out','l','r');
    if(k===IDX){s.classList.add('on',DIR>0?'r':'l');void s.offsetWidth;s.classList.remove('r','l');s.classList.add('in');typeSet(s,RM?1e9:0)}
    else if(s.classList.contains('on')){s.classList.remove('on');s.classList.add('out',DIR>0?'l':'r')}});
  r.querySelectorAll('.lv-bars i').forEach(function(b,j){b.className=j<IDX?'done':(j===IDX?'on':'');b.firstChild.style.width=j<IDX?'100%':'0'});
  r.querySelector('.lv-n').textContent=(IDX+1)+'/'+N;
  T0=performance.now()}
function tick(now){var r=root();if(!r){RAF=0;return}RAF=requestAnimationFrame(tick);
  if(document.hidden||DRAG){T0+=16;return}
  var s=r.querySelector('.lv-s.on');if(!s) return;
  var len=total(s),dur=RM?0:len*1000/CPS,el=now-T0,span=dur+HOLD;
  typeSet(s,RM?1e9:Math.floor(el*CPS/1000));
  var b=r.querySelector('.lv-bars i.on b');if(b) b.style.width=Math.min(100,el/span*100)+'%';
  if(N>1&&el>=span) show(IDX+1,1)}
function start(){var r=root();if(!r||r._live) return;r._live=1;fit(r);show(IDX,1);if(!RAF) RAF=requestAnimationFrame(tick)}

var _vh=viewHome;
viewHome=function(){var h=_vh(),i=h.indexOf('<button class="gl focus"');if(i<0) return h;var j=h.indexOf('</button>',i)+9;
  return h.slice(0,i)+feedHTML()+h.slice(j)};
var _r=render;render=function(top){_r(top);start()};
addEventListener('resize',function(){var r=root();if(r) fit(r)});
/* swipe left = next, swipe right = back; the slide follows the finger */
document.addEventListener('pointerdown',function(e){var st=e.target.closest('.lv-stage');if(!st||N<2) return;
  DRAG={x:e.clientX,y:e.clientY,dx:0,on:0,s:st.querySelector('.lv-s.on'),id:e.pointerId,st:st}});
document.addEventListener('pointermove',function(e){if(!DRAG||e.pointerId!==DRAG.id) return;var dx=e.clientX-DRAG.x,dy=e.clientY-DRAG.y;
  if(!DRAG.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){DRAG=null;return}if(Math.abs(dx)<8) return;DRAG.on=1;try{DRAG.st.setPointerCapture(e.pointerId)}catch(_){}}
  DRAG.dx=dx;if(DRAG.s){DRAG.s.style.transition='none';DRAG.s.style.transform='translate3d('+dx*.55+'px,0,0)';DRAG.s.style.opacity=Math.max(.35,1-Math.abs(dx)/320)}});
function end(e){if(!DRAG||e.pointerId!==DRAG.id) return;var d=DRAG;DRAG=null;if(!d.on) return;SWIPED=Date.now();
  if(Math.abs(d.dx)>40){if(d.s) d.s.style.opacity='';show(IDX+(d.dx<0?1:-1),d.dx<0?1:-1)}
  else if(d.s){d.s.style.transition='';d.s.style.transform='';d.s.style.opacity=''}}
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
document.addEventListener('click',function(e){var s=e.target.closest('.gl.lv');if(!s) return;
  if(Date.now()-SWIPED<350){e.preventDefault();e.stopPropagation();return}
  var bar=e.target.closest('.lv-bars i');if(bar){var k=Array.prototype.indexOf.call(bar.parentNode.children,bar);show(k,k>=IDX?1:-1);return}
  var cur=s.querySelector('.lv-s.on');if(cur&&cur.dataset.id){go('athlete',{id:cur.dataset.id,t:cur.dataset.t});return}
  go('schedule')},true);
var _ls=loadScenario;loadScenario=function(k){IDX=0;_ls(k);seed()};
render(true);
})();

/* ============================================================
   VANTAGE — Log activity (same for every role: parent, private
   coach, agent, other). Calendar day → Log activity → choose:
   Training · Therapy & massage · Other. The screen first shows
   how busy each athlete's day already is (club commitments from
   RYSEON + entries already added), and every form warns on clashes.
   ============================================================ */
(function(){
var OTYPES=['Meeting','Video session','Medical check','Travel','Other'];
OTYPES.forEach(function(t){KIND[t]='o'});
canAdd=function(){return true};
canAddTher=function(){return true};
var _evIcon=evIcon;evIcon=function(e){return e.k==='o'?CI.cal:_evIcon(e)};
CI.dots='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="12" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="18" cy="12" r=".9"/></svg>';

function mins(t){var p=t.split(':');return (+p[0])*60+(+p[1])}
function hm(m){return pad(Math.floor(m/60)%24)+':'+pad(m%60)}
function src(e){return e.by==='you'||e.tby==='you'?'added':(e.k==='m'||e.type==='Team Training'||e.type==='Match Preparation'?'club':'plan')}
/* clashes against everything already in the athlete's day (club + entries) */
clashes=function(f){
  if(!f.k||!f.time) return [];
  var d=parseK(f.k),s=mins(f.time),e=s+f.dur,out=[];
  (f.ath||[]).forEach(function(id){eventsFor(id,d).forEach(function(x){var xs=mins(x.time),xe=xs+x.dur;
    if(xs<e&&s<xe) out.push(A(id).first+' is busy '+x.time+'–'+hm(xe)+' · '+(x.k==='m'?'match':x.type)+(src(x)==='added'?' (already added)':src(x)==='club'?' (club)':''))})});
  return out};

/* day bar 06:00–23:00 with busy blocks */
var D0=360,D1=1380;
function dayBar(evs){return '<span class="lg-bar">'+evs.map(function(x){var s=Math.max(D0,mins(x.time)),e=Math.min(D1,mins(x.time)+x.dur);if(e<=s) return '';
  return '<i class="s-'+src(x)+(x.k==='m'?' m':'')+'" style="left:'+((s-D0)/(D1-D0)*100).toFixed(2)+'%;width:'+Math.max(1.5,(e-s)/(D1-D0)*100).toFixed(2)+'%"></i>'}).join('')+'</span>'}
function free(evs){var b=evs.map(function(x){return [mins(x.time),mins(x.time)+x.dur]}).sort(function(p,q){return p[0]-q[0]}),cur=480,best=null;
  b.concat([[1290,1290]]).forEach(function(r){if(r[0]-cur>=60&&(!best||r[0]-cur>best[1]-best[0])) best=[cur,r[0]];cur=Math.max(cur,r[1])});
  return best?'Free '+hm(best[0])+'–'+hm(best[1]):'No long free window'}
function logSheet(o){
  var d=parseK(o.k),ids=calIds(),off=Math.round((d-TODAY)/864e5);
  var ey=off===0?'Today':(off===1?'Tomorrow':fmt(d,'rel'));
  var h='<div class="dr-top"><button class="lt-back" type="button" data-a="logBack" aria-label="Back">'+I.left+'</button><h2>Log activity</h2><span style="width:46px"></span></div><div class="dr-body">'+
    '<div class="dv-hero"><small>'+esc(ey)+'</small><h3>'+DOW[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()+'</h3><p>What would you like to add?</p></div>'+
    rgroup('Add',[
      rrow({ic:CI.up,l:'Training',sub:'Individual or small-group session · tag athletes',act:'addOpen',attr:' data-k="'+o.k+'"'}),
      rrow({ic:CI.heart,l:'Therapy or massage',sub:'Physio, massage, recovery · with location',act:'therOpen',attr:' data-k="'+o.k+'"'}),
      rrow({ic:CI.dots,l:'Something else',sub:'Meeting, video session, medical check, travel',act:'othOpen',attr:' data-k="'+o.k+'"'})]);
  h+='<section class="rgroup"><h4>Already on this day</h4><div class="lg-legend"><span><i class="s-club"></i>Club</span><span><i class="s-plan"></i>RYSEON plan</span><span><i class="s-added"></i>Added by you</span></div>'+
    '<div class="lg-ticks">'+[6,10,14,18,22].map(function(h){return '<span style="left:'+((h*60-D0)/(D1-D0)*100).toFixed(2)+'%">'+pad(h)+'</span>'}).join('')+'</div><div class="rp-g">'+
    ids.map(function(id){var a=A(id),ev=eventsFor(id,d);
      return '<div class="rp-item lg-a">'+ava(a)+'<span class="t"><b>'+esc(a.first)+'<span class="lg-st">'+(ev.length?ev.length+' busy · '+free(ev):'Free all day')+'</span></b>'+dayBar(ev)+
        (ev.length?'<small>'+ev.map(function(x){return x.time+' '+esc(x.k==='m'?(x.ha==='Away'?'@ ':'vs ')+x.opp:x.type)}).join(' · ')+'</small>':'')+'</span></div>'}).join('')+'</div></section>';
  var notS=liveIds().filter(function(id){return !P(id).schedule});
  if(notS.length) h+='<p class="note">'+notS.map(function(id){return A(id).first}).join(', ')+(notS.length>1?' aren’t':' isn’t')+' sharing a schedule, so you can’t see when '+(notS.length>1?'they are':'they are')+' busy.</p>';
  h+='<p class="note">Anything you add goes to the athlete’s RYSEON calendar. The athlete decides whether to keep it.</p>';
  return h+'</div>';
}

/* Training / Other share one form: mode 'other' swaps the type list and title */
var _addSheet=addSheet;
addSheet=function(o){var h=_addSheet(o);if(o.mode!=='other') return h;
  h=h.replace('<h2>Add training</h2>','<h2>Something else</h2>');
  h=h.replace(/<section class="rgroup"><h4>Session<\/h4><div class="chips wrap">[\s\S]*?<\/div><\/section>/,'<section class="rgroup"><h4>Type</h4><div class="chips wrap">'+OTYPES.map(function(t){return '<button class="chip" type="button" data-a="fType" data-v="'+t+'" aria-pressed="'+(o.f.type===t)+'">'+t+'</button>'}).join('')+'</div></section>');
  h=h.replace(/Add training · (\d+)/,'Add '+esc(o.f.type.toLowerCase())+' · $1').replace('placeholder="Focus, e.g. finishing and first touch"','placeholder="e.g. meeting with the academy staff"').replace('Location, e.g. Jarun pitch 3','Location or address');
  return h};
/* therapy form: show clashes for the chosen athlete */
var _therSheet=therSheet;
therSheet=function(o){var h=_therSheet(o),f=o.f;if(!f.a) return h;var cl=clashes({k:f.k,time:f.time,dur:f.dur,ath:[f.a]});if(!cl.length) return h;
  return h.replace('<section class="rgroup"><h4>Location</h4>','<div class="clash">'+I.info+'<span>'+cl.map(esc).join('<br>')+'</span></div><section class="rgroup"><h4>Location</h4>')};

/* Day report: one "Log activity" entry for everyone */
var _daySheet=daySheet;
daySheet=function(o){var h=_daySheet(o),d=parseK(o.k);
  h=h.replace(/<section class="rgroup"><h4>Plan this day<\/h4>[\s\S]*?<\/div><\/section>(?=<\/div>$)/,'').replace('<p class="note" style="margin-top:18px">View only. Each athlete shares this schedule from RYSEON.</p>','');
  h=h.replace(/<span class="by">Added by you/g,'<span class="by">Added by you in VANTAGE');
  if(d<TODAY) return h;
  return h.replace(/<\/div>$/,'<div class="dr-foot"><button class="lt-save" type="button" data-a="logOpen" data-k="'+o.k+'">'+CI.plus.replace('<svg','<svg style="width:18px;height:18px;margin-right:6px;vertical-align:-3px"')+'Log activity</button></div></div>')};
/* calendar sheet: one button */
var _calSheet=calSheet;
calSheet=function(o){var h=_calSheet(o),m=o.m,k=m.getMonth()===TODAY.getMonth()&&m.getFullYear()===TODAY.getFullYear()?dkey(TODAY):dkey(m<TODAY?TODAY:m);
  return h.replace(/<button class="cal-add" type="button" data-a="(addOpen|therOpen)"[^>]*>[\s\S]*?<\/button>/,'<button class="cal-add" type="button" data-a="logOpen" data-k="'+k+'">'+CI.plus+'Log activity</button>')};
/* Schedule page header button */
var _vs=viewSchedule;
viewSchedule=function(){return _vs().replace(/data-a="addOpen"([^>]*)>(<svg[\s\S]*?<\/svg>)Add training<\/button>/,'data-a="logOpen"$1>$2Log activity</button>')};
/* Health tab: therapy button stays (already there for everyone now) */

var _renderOv=renderOv;
renderOv=function(){var o=S.ov;if(o&&o.t==='log') return '<div class="fullscr" role="dialog" aria-label="Log activity">'+logSheet(o)+'</div>';return _renderOv()};

document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t) return;var a=t.getAttribute('data-a'),d=t.dataset,o=S.ov;
  if(a==='logOpen'){var k=d.k<dkey(TODAY)?dkey(TODAY):d.k;S.ov={t:'log',k:k,back:o};render()}
  else if(a==='logBack'){S.ov=o.back||null;render()}
  else if(a==='othOpen'){var f=newForm(d.k);f.type='Meeting';f.time='12:00';S.ov={t:'add',mode:'other',f:f,back:o};render()}

  if(o&&o.back&&o.back.t==='log'){var lb=o.back;o.back={t:'day',k:lb.k,back:lb.back&&lb.back.t==='day'?lb.back.back:lb.back}}},true);
document.addEventListener('click',function(e){var t=e.target.closest('[data-a="addSave"]');var o=S.ov;if(!t||!o||o.mode!=='other') return;
  e.stopImmediatePropagation();var f=o.f;if(!f.ath.length) return;
  ADDED.push({id:'x'+Date.now(),k:f.k,time:f.time,dur:f.dur,type:f.type,loc:f.loc.trim(),note:f.note.trim(),ath:f.ath.slice()});
  S.ov={t:'day',k:f.k,back:o.back&&o.back.t==='day'?o.back.back:{t:'cal',m:new Date(parseK(f.k).getFullYear(),parseK(f.k).getMonth(),1)}};render();
  toast(f.type+' added · '+f.ath.map(function(z){return A(z).first}).join(', '))},true);
render(true);
})();

/* ============================================================
   VANTAGE — navigation transitions (RYSEON pattern).
   Changing screen: the current page eases out (fade + 8px up),
   then the next page is swapped in and its sections rise in.
   Everything else re-renders in place without motion (see morph).
   ============================================================ */
(function(){
function vkey(){return S.ob?'ob:'+S.step:'v:'+S.view+':'+(S.view==='athlete'?S.aid:'')}
var LAST=vkey(),PEND=null,TOP=false,inner=render;
function leaving(){var m=document.getElementById('main');
  if(!S._wasOb&&m) return Array.prototype.slice.call(m.children);
  return Array.prototype.slice.call(root.children).filter(function(n){return !isOv(n)&&!n.classList.contains('bnav')})}
render=function(top){
  var k=vkey();
  if(PEND){TOP=TOP||!!top;return}
  if(k===LAST||!root.firstChild){LAST=k;S._wasOb=S.ob;inner(top);return}
  var els=leaving(),obSwitch=S._wasOb!==S.ob;
  els.forEach(function(e){e.classList.add('v-leave')});
  TOP=!!top;
  PEND=setTimeout(function(){PEND=null;LAST=vkey();SCREEN_FRESH=true;try{inner(TOP)}finally{SCREEN_FRESH=false}S._wasOb=S.ob;
    var m=document.getElementById('main');if(m) m.scrollTop=0;
    var col=document.querySelector('.ob-col');if(col) col.scrollTop=0},obSwitch?260:170);
};
S._wasOb=S.ob;
})();
